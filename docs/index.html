<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fffaf8">
  <title>Festas &amp; Decorações</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎈</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Boas-vindas / login -->
  <div id="telaLogin" class="boas oculto">
    <div class="capa">
      <div class="baloes">🎈🎀🎂</div>
      <div class="marca"><div class="nome" style="font-size:2rem">Festas &amp;<br>Decorações</div></div>
      <p>Transforme cada festa em um momento inesquecível!</p>
      <div style="font-size:2.2rem;margin-top:10px">🧸🌸🎁</div>
    </div>
    <div id="escolha" style="padding:22px">
      <button class="btn bloco" id="irEntrar">🔓 Entrar</button>
      <button class="btn bloco claro" id="irCadastrar" style="margin-top:10px">Cadastrar</button>
    </div>
    <form id="formLogin" class="oculto">
      <input class="ctl" type="email" id="email" placeholder="E-mail" autocomplete="username" required style="margin-bottom:10px">
      <input class="ctl" type="password" id="senha" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password" required minlength="6" style="margin-bottom:14px">
      <button class="btn bloco" id="btnEntrar">Entrar</button>
      <p style="text-align:center;margin:14px 0 4px"><a href="#" id="trocarModo">Primeiro acesso? Criar conta</a></p>
      <p style="text-align:center;margin:0"><a href="#" id="esqueci" class="suave">Esqueci a senha</a></p>
    </form>
  </div>

  <!-- App -->
  <div id="telaApp" class="app oculto">
    <header class="topo">
      <button class="bt" id="btnEsq" aria-label="Menu">☰</button>
      <h1 id="titulo">Início</h1>
      <div id="topoDir" style="min-width:38px;display:flex;justify-content:flex-end"></div>
    </header>
    <main id="conteudo"></main>
    <nav class="nav">
      <button data-rota="inicio"><span class="i">🏠</span>Início</button>
      <button data-rota="clientes"><span class="i">👥</span>Clientes</button>
      <button data-rota="orcamentos"><span class="i">📝</span>Orçamentos</button>
      <button data-rota="produtos"><span class="i">🎀</span>Produtos</button>
      <button data-rota="mais"><span class="i">⋯</span>Mais<span class="badge oculto" id="badgeMais"></span></button>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/comum.js"></script>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
